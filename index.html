<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EV SPORTS — Home</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080b; --surface:#101217; --surface2:#171a21; --text:#f7f7f8;
  --muted:#9a9da6; --orange:#ff5a1f; --orange2:#ff761f;
  --line:rgba(255,255,255,.10); --max:1440px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Satoshi,Segoe UI,Arial,sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* HEADER */
.header{
  position:fixed;inset:0 0 auto;z-index:100;height:76px;
  display:flex;align-items:center;gap:34px;padding:0 38px;
  background:linear-gradient(180deg,rgba(4,5,8,.92),rgba(4,5,8,.55),transparent);
}
.brand{display:flex;align-items:center;gap:13px;flex:none}
.brand img:first-child{height:31px;width:auto}
.brand-divider{width:1px;height:27px;background:rgba(255,255,255,.24)}
.brand img:last-child{height:28px;width:auto}
.nav{display:flex;align-items:center;gap:29px;font-size:13px;font-weight:800;color:#9699a2}
.nav a{transition:.2s}
.nav a:hover,.nav a.active{color:#fff}
.nav a.active{position:relative}
.nav a.active:after{content:"";position:absolute;height:2px;background:var(--orange);left:0;right:0;bottom:-11px}
.header-spacer{flex:1}
.header-icon{
  width:38px;height:38px;border:1px solid rgba(255,255,255,.22);border-radius:50%;
  background:rgba(0,0,0,.22);color:#fff;display:grid;place-items:center
}
.premium-badge{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid rgba(255,90,31,.48);
  background:rgba(255,90,31,.12);
  color:#fff;border-radius:22px;padding:9px 15px;
  font-size:11px;font-weight:900;letter-spacing:.45px;
  box-shadow:0 0 18px rgba(255,90,31,.08);
}
.premium-dot{
  width:7px;height:7px;border-radius:50%;
  background:#ff5a1f;box-shadow:0 0 8px rgba(255,90,31,.8);
}

/* HERO */
.hero{position:relative;height:min(650px,72vh);min-height:510px;overflow:hidden;background:#05070d}
.hero-bg{position:absolute;inset:0;background:#07102a}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center;filter:saturate(1.1) contrast(1.03)}
.hero-bg:after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(3,5,12,.98) 0%,rgba(3,5,12,.78) 25%,rgba(3,5,12,.15) 62%,rgba(3,5,12,.20) 100%),
    linear-gradient(0deg,#07080b 0%,rgba(7,8,11,.35) 30%,rgba(7,8,11,.08) 70%);
}
.hero-content{
  position:relative;z-index:2;height:100%;max-width:var(--max);margin:auto;
  padding:165px 54px 75px;display:flex;align-items:center
}
.hero-copy{width:min(510px,46vw)}
.hero-tag{display:inline-flex;background:#138bf5;color:#fff;font-size:11px;font-weight:900;padding:7px 12px;border-radius:3px;margin-bottom:13px}
.hero-title{font-size:clamp(36px,4.2vw,62px);line-height:.98;margin:0 0 12px;font-weight:900;letter-spacing:-2px}
.hero-title .vs{font-size:.55em;color:#8e929d;font-style:italic;margin:0 4px}
.hero-event{font-size:14px;color:#aeb1b9;font-weight:600;margin-bottom:16px}
.hero-time{font-size:15px;font-weight:800;margin-bottom:26px}
.hero-actions{display:flex;gap:10px}
.primary,.secondary{
  min-width:180px;padding:14px 22px;border:0;border-radius:3px;font-weight:900;font-size:13px
}
.primary{background:#fff;color:#101114}
.primary:hover{background:#eee}
.secondary{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.22)}
.hero-arrow{
  position:absolute;z-index:4;top:50%;transform:translateY(-50%);
  width:42px;height:70px;border:0;background:transparent;color:#fff;font-size:42px;opacity:.9
}
.hero-arrow.left{left:8px}.hero-arrow.right{right:8px}
.hero-dots{position:absolute;z-index:5;left:54px;bottom:38px;display:flex;gap:5px}
.hero-dot{width:7px;height:7px;border:0;border-radius:50%;background:#666b74;padding:0}
.hero-dot.active{width:19px;border-radius:5px;background:#fff}

/* CONTENT */
.main{max-width:var(--max);margin:auto;padding:0 54px 55px}
.section{margin-top:20px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.section-title{font-size:24px;font-weight:900;letter-spacing:-.5px}
.section-title span{font-size:25px;color:#c5c8ce;margin-left:5px}
.section-link{font-size:12px;font-weight:800;color:#a7abb4}
.section-link:hover{color:#fff}
.rail{display:flex;gap:14px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{
  position:relative;flex:0 0 265px;height:170px;overflow:hidden;border-radius:3px;
  background:#12151b;border:1px solid rgba(255,255,255,.08);cursor:pointer
}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:hover img{transform:scale(1.045)}
.card:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(3,4,7,.95),rgba(3,4,7,.04) 70%)
}
.card-info{position:absolute;z-index:2;left:14px;right:12px;bottom:12px}
.card-title{font-size:14px;font-weight:900;line-height:1.1}
.card-sub{font-size:10px;color:#b5b8c0;margin-top:5px;font-weight:600}
.badge{
  position:absolute;z-index:3;left:11px;top:10px;padding:5px 8px;border-radius:3px;
  background:rgba(0,0,0,.72);font-size:9px;font-weight:900;letter-spacing:.5px
}
.badge.live{color:#ff5a1f}.badge.upcoming{color:#fff}
.live-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:5px}

/* ALL MATCHES */
.match-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.match-card{
  background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;
  transition:transform .2s,border-color .2s
}
.match-card:hover{transform:translateY(-2px);border-color:rgba(255,90,31,.45)}
.match-thumb{height:175px;position:relative;background:#080a0e}
.match-thumb img{width:100%;height:100%;object-fit:cover}
.match-thumb:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(0deg,rgba(5,6,9,.95),transparent)}
.match-body{padding:15px}
.match-name{font-size:15px;font-weight:900;line-height:1.15}
.match-event{color:var(--muted);font-size:11px;margin-top:7px}
.match-time{color:#d0d2d7;font-size:11px;margin-top:5px}
.match-btn{
  width:100%;margin-top:13px;border:0;border-radius:3px;padding:11px;background:var(--orange);
  color:#fff;font-size:11px;font-weight:900
}
.match-btn.up{background:var(--surface2);color:#d6d8dd;border:1px solid var(--line)}
.match-btn.done{background:#20232a;color:#898d96}
.loading,.empty{padding:55px;text-align:center;color:var(--muted);grid-column:1/-1}

/* SEARCH */
.search{
  display:flex;align-items:center;gap:9px;background:rgba(16,18,23,.9);
  border:1px solid var(--line);border-radius:3px;padding:9px 12px;width:260px
}
.search svg{opacity:.55}
.search input{width:100%;border:0;outline:0;background:none;color:#fff;font-size:12px;font-weight:600}
.search input::placeholder{color:#858993}

/* FOOTER */
.footer{margin-top:50px;border-top:1px solid var(--line);padding:28px 0;color:#777b84;text-align:center;font-size:10px;letter-spacing:.7px}

/* RESPONSIVE */
@media(max-width:1050px){
  .nav{gap:16px}.header{padding:0 20px;gap:20px}.main{padding:0 25px 45px}
  .hero-content{padding-left:45px}.hero-dots{left:45px}.match-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:760px){
  .header{height:64px}.brand img:first-child{height:25px}.brand img:last-child{height:23px}
  .nav{display:none}.premium-badge{display:inline-flex;font-size:9px;padding:7px 10px}
  .hero{height:560px;min-height:0}.hero-content{padding:135px 24px 65px;align-items:flex-start}
  .hero-copy{width:78%}.hero-title{font-size:39px}.hero-bg img{object-position:62% center}
  .hero-bg:after{background:linear-gradient(90deg,rgba(3,5,12,.97),rgba(3,5,12,.56) 65%,rgba(3,5,12,.18)),linear-gradient(0deg,#07080b,transparent 60%)}
  .hero-arrow{width:28px;font-size:32px}.hero-dots{left:24px;bottom:28px}
  .main{padding:0 18px 40px}.section-title{font-size:20px}
  .search{width:100%}.section-head{gap:12px;flex-wrap:wrap}.match-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:480px){
  .hero-copy{width:90%}.hero-title{font-size:34px;letter-spacing:-1px}
  .hero-actions .secondary{display:none}.primary{min-width:160px}
  .card{flex-basis:235px;height:150px}.match-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="header">
  <a class="brand" href="#">
    <img src="https://raw.githubusercontent.com/saptarshiorg/saptarshiorg.github.io/refs/heads/main/magenta.png" alt="EV logo">
    <span class="brand-divider"></span>
    <img src="https://www.fancode.com/skillup-uploads/fc-web-logo/fc_logo_white_bg.svg" alt="FanCode logo">
  </a>
  <nav class="nav">
    <a class="active" href="#">Home</a><a href="#live">Live Now</a><a href="#schedule">Schedule</a>
    <a href="#cricket">Cricket</a><a href="#football">Football</a><a href="#all">All Sports</a>
  </nav>
  <div class="header-spacer"></div>
  <div class="premium-badge"><span class="premium-dot"></span> PREMIUM ACTIVATED</div>
</header>

<section class="hero" id="hero">
  <div class="hero-bg"><img id="heroImage" src="" alt=""></div>
  <button class="hero-arrow left" id="heroPrev" aria-label="Previous">‹</button>
  <button class="hero-arrow right" id="heroNext" aria-label="Next">›</button>
  <div class="hero-content">
    <div class="hero-copy">
      <div class="hero-tag" id="heroStatus">UPCOMING</div>
      <h1 class="hero-title" id="heroTitle">Loading matches...</h1>
      <div class="hero-event" id="heroEvent"></div>
      <div class="hero-time" id="heroTime"></div>
      <div class="hero-actions">
        <button class="primary" id="heroAction">VIEW DETAILS</button>
        <button class="secondary" id="heroSchedule">SCHEDULE</button>
      </div>
    </div>
  </div>
  <div class="hero-dots" id="heroDots"></div>
</section>

<main class="main">
  <section class="section" id="live">
    <div class="section-head">
      <div class="section-title">All Live Now <span id="liveCount">(0)</span></div>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="SEARCH TEAM OR EVENT...">
      </div>
    </div>
    <div class="rail" id="liveRail"><div class="loading">LOADING...</div></div>
  </section>

  <section class="section" id="schedule">
    <div class="section-head">
      <div class="section-title">Upcoming Matches</div>
      <a class="section-link" href="#all">VIEW ALL ›</a>
    </div>
    <div class="rail" id="upcomingRail"><div class="loading">LOADING...</div></div>
  </section>

  <section class="section" id="all">
    <div class="section-head"><div class="section-title">All Matches</div></div>
    <div class="match-grid" id="matchesGrid"><div class="loading">LOADING MATCHES...</div></div>
  </section>

  <footer class="footer">CREDITS TO RISHI.EV | Saptarshi Samanta</footer>
</main>

<script>
const CNPTV_SOURCE='https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/main/fan.json';
const WORLD_SOURCE='https://raw.githubusercontent.com/kajju027/Fancode-Events-Json/main/fancode.json';
const PLAYER_PAGE='fcplayer.html';
const FALLBACK_IMG='https://www.fancode.com/skillup-uploads/cms-media/Cricket_Fallback_Old_match-card.jpg';
const LANG_CODE_MAP={ENGLISH:'eng',HINDI:'hin',BANGLA:'ban',BENGALI:'ban',TAMIL:'tam',TELUGU:'tel',KANNADA:'kan',MARATHI:'mar',MALAYALAM:'mal',PUNJABI:'pan',GUJARATI:'guj',URDU:'urd',ODIA:'ori',ASSAMESE:'asm',BHOJPURI:'bho'};

let allMatches=[], heroes=[], heroIndex=0, heroTimer=null;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseTime(str){
  if(!str)return null;
  const m=String(str).match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if(!m){const d=new Date(str);return isNaN(d)?null:d}
  const months={january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,september:8,october:9,november:10,december:11};
  let [,day,mon,year,hour,min,ampm]=m; let h=+hour;
  if(ampm){ampm=ampm.toUpperCase();if(ampm==='PM'&&h<12)h+=12;if(ampm==='AM'&&h===12)h=0}
  return new Date(+year,months[mon.toLowerCase()],+day,h,+min);
}
function fmt(d){
  if(!d)return 'TIME TBA';
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}).toUpperCase()+', '+
    d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}).toUpperCase();
}
function langCode(raw){const x=String(raw||'').trim().toUpperCase();return LANG_CODE_MAP[x]||x.slice(0,3).toLowerCase()||'eng'}
function playerUrl(m,i=0){return `${PLAYER_PAGE}?id=${m.id}_${langCode(m.language)}&s=${i}`}
function openNewTab(url){
  if(!url)return;
  const w=window.open(url,'_blank','noopener,noreferrer');
  if(!w) window.location.href=url;
}
function buildMatches(cn,world){
  const map={};(cn.matches||[]).forEach(x=>map[x.match_id]=x);
  return (world.matches||[]).map(x=>{
    const status=String(x.status||'').toUpperCase();
    const c=map[x.match_id], streams=x.streams||{};
    return {
      id:x.match_id,title:x.title||'Match',tournament:x.tournament||'',image:x.image||FALLBACK_IMG,
      status:status==='LIVE'?'LIVE':status==='COMPLETED'?'COMPLETED':'UPCOMING',
      time:parseTime(x.startTime),language:x.language,cnptv:c?.cnptv_cdn||null,
      lk:streams.fancode_lk_cdn||null,np:streams.fancode_np_cdn||null,bd:streams.fancode_bd_cdn||null
    }
  }).sort((a,b)=>{
    const rank={LIVE:0,UPCOMING:1,COMPLETED:2};
    if(rank[a.status]!==rank[b.status])return rank[a.status]-rank[b.status];
    return (a.time?.getTime()||Infinity)-(b.time?.getTime()||Infinity);
  });
}

function card(m,compact=false){
  const live=m.status==='LIVE';
  return `<article class="${compact?'card':'match-card'}" data-id="${esc(m.id)}">
    <div class="${compact?'':'match-thumb'}">
      <img src="${esc(m.image)}" alt="${esc(m.title)}" onerror="this.src='${FALLBACK_IMG}'">
      <span class="badge ${live?'live':'upcoming'}">${live?'<span class="live-dot"></span>LIVE':m.status}</span>
    </div>
    ${compact?`<div class="card-info"><div class="card-title">${esc(m.title)}</div><div class="card-sub">${esc(m.tournament)} • ${esc(fmt(m.time))}</div></div>`:
    `<div class="match-body"><div class="match-name">${esc(m.title)}</div><div class="match-event">${esc(m.tournament)}</div><div class="match-time">${esc(fmt(m.time))}</div>
      <button class="match-btn ${m.status==='UPCOMING'?'up':''} ${m.status==='COMPLETED'?'done':''}" data-watch="${m.status==='LIVE'?'1':'0'}">${m.status==='LIVE'?'WATCH NOW':m.status==='COMPLETED'?'THANK YOU':'UPCOMING'}</button></div>`}
  </article>`;
}

function renderRails(list){
  const live=list.filter(m=>m.status==='LIVE'), upcoming=list.filter(m=>m.status==='UPCOMING');
  document.getElementById('liveCount').textContent=`(${live.length})`;
  document.getElementById('liveRail').innerHTML=live.length?live.map(m=>card(m,true)).join(''):'<div class="loading">NO LIVE MATCHES RIGHT NOW</div>';
  document.getElementById('upcomingRail').innerHTML=upcoming.length?upcoming.map(m=>card(m,true)).join(''):'<div class="loading">NO UPCOMING MATCHES</div>';
}
function renderGrid(list){document.getElementById('matchesGrid').innerHTML=list.length?list.map(m=>card(m)).join(''):'<div class="empty">No matches found.</div>'}

function setHero(i,reset=true){
  if(!heroes.length)return;
  heroIndex=(i+heroes.length)%heroes.length;const m=heroes[heroIndex];
  const img=document.getElementById('heroImage');img.src=m.image;img.alt=m.title;
  document.getElementById('heroStatus').textContent=m.status;
  document.getElementById('heroTitle').innerHTML=esc(m.title).replace(/\s+vs\s+/i,' <span class="vs">VS</span> ');
  document.getElementById('heroEvent').textContent=`${m.tournament}${m.tournament&&m.time?' • ':''}${m.time?'Match time':''}`;
  document.getElementById('heroTime').textContent=m.time?fmt(m.time):'TIME TBA';
  document.getElementById('heroAction').textContent=m.status==='LIVE'?'WATCH NOW':'VIEW DETAILS';
  document.getElementById('heroAction').onclick=()=>{ if(m.status==='LIVE'&&m.cnptv) openNewTab(playerUrl(m)); else document.getElementById('schedule').scrollIntoView({behavior:'smooth'}) };
  const dots=document.getElementById('heroDots');
  dots.innerHTML=heroes.slice(0,9).map((_,n)=>`<button class="hero-dot ${n===heroIndex?'active':''}" data-i="${n}"></button>`).join('');
  if(reset){clearInterval(heroTimer);heroTimer=setInterval(()=>setHero(heroIndex+1,false),6500)}
}
function attach(){
  document.getElementById('heroPrev').onclick=()=>setHero(heroIndex-1);
  document.getElementById('heroNext').onclick=()=>setHero(heroIndex+1);
  document.getElementById('heroDots').onclick=e=>{const b=e.target.closest('[data-i]');if(b)setHero(+b.dataset.i)};
  document.addEventListener('click',e=>{
    const c=e.target.closest('.match-card');
    if(c){const m=allMatches.find(x=>String(x.id)===c.dataset.id);if(m?.status==='LIVE'&&m.cnptv)openNewTab(playerUrl(m))}
  });
  document.getElementById('searchInput').oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    renderGrid(allMatches.filter(m=>!q||m.title.toLowerCase().includes(q)||m.tournament.toLowerCase().includes(q)));
  };
}
async function refresh(){
  try{
    const [cn,world]=await Promise.all([
      fetch(CNPTV_SOURCE,{cache:'no-store'}).then(r=>r.json()).catch(()=>({matches:[]})),
      fetch(WORLD_SOURCE,{cache:'no-store'}).then(r=>r.json())
    ]);
    allMatches=buildMatches(cn,world);
    heroes=allMatches.filter(m=>m.status!=='COMPLETED').slice(0,9);
    if(!heroes.length)heroes=allMatches.slice(0,9);
    renderRails(allMatches);renderGrid(allMatches);setHero(Math.min(heroIndex,Math.max(0,heroes.length-1)));
  }catch(e){
    document.getElementById('matchesGrid').innerHTML='<div class="empty">Could not load matches. Please refresh.</div>';
    document.getElementById('heroTitle').textContent='Unable to load matches';
  }
}

/* EMBED PROTECTION
   If this page is placed inside an iframe on another site, attempt to
   open the standalone page in a new tab. Normal top-level use is unchanged.
*/
(function(){
  try{
    if(window.top !== window.self){
      const standaloneUrl = window.location.href;
      const popup = window.open(standaloneUrl, '_blank', 'noopener,noreferrer');
      if(popup){
        try{ window.top.location.replace('about:blank'); }catch(e){}
      }
    }
  }catch(e){}
})();

attach();refresh();
</script>
</body>
</html>
